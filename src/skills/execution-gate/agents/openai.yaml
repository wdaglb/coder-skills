interface:
  display_name: "需求澄清门"
  short_description: "实质执行前先判轻重任务并固定回答格式"
  default_prompt: "使用 $execution-gate 处理开始、继续、实现、修复、修改、新增、补充、生成、写入、执行、落地、排查并处理等会产生实际交付的请求；首段固定输出【任务理解】【判断】【风险】【做法/下一步】，轻任务直接执行，重任务转交 $ambiguity-planner；重任务规划明确后不再单独询问是否落实方案文件，直接进入方案文件审查与确认写入的同一次询问；方案文件落地后先用固定选项确认是否拆分实施任务，用户选择 2 不拆分并直接开始实施时，不再二次询问确认。"
