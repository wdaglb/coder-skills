interface:
  display_name: "需求澄清门"
  short_description: "实质执行前先过统一门禁；覆盖显式实现请求与需求列表式隐含实施请求"
  default_prompt: "使用 $execution-gate 处理新增、增加、补充、调整、修复、排查、生成、实现或继续已有任务，包括直接给出需求列表、业务规则、报表口径、生成条件、参与度口径等隐含要求落地的场景：先输出任务理解、轻/重任务判断与风险；轻任务直接执行；重任务显式转交 $ambiguity-planner 做分步收敛；方案文件准备写入 docs/plans 前，必须先确认已有完整方案正文，缺少正文时不得编造或输出空方案，必须继续收敛或补齐正文；有完整正文后输出完整方案内容和目标路径让用户审查，只有用户选择 1 确认写入时才写入，非 1 输入默认视为修改方案并继续审查；方案写入后退出方案规划且方案文件只读，再确认是否拆分实施任务；若任务会产生正式改动且位于 Git 仓库中，再使用 $git-action 处理任务分支与高风险 Git 动作。"
