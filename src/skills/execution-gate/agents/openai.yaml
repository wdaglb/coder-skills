interface:
  display_name: "需求澄清门"
  short_description: "实质执行前先判轻重任务并固定回答格式"
  default_prompt: "使用 $execution-gate 处理开始、继续、实现、修复、修改、新增、补充、生成、写入、执行、落地、排查并处理等会产生实际交付的请求；首段固定输出【任务理解】【判断】【风险】【做法/下一步】，轻任务直接执行，重任务转交 $ambiguity-planner；所有任务默认只运行当前项目已有的静态 lint，不运行类型检查、格式检查、构建、测试、smoke 或运行态验证；当前项目没有可用 lint 时如实说明验证未完成，只有用户明确指定测试时才执行对应测试；GitNexus 只用于判断影响范围，不自动升级测试要求；规划、调度和 lint 安排不能占用任务大部分时间，只有大型、明确可并行或高风险任务才启用复杂流程；重任务规划明确后不生成预览草稿，直接写入正式 docs/plans 方案文件；方案文件落地后用固定选项确认下一阶段动作：1 使用 [plan-implementation-tasks](src/skills/plan-implementation-tasks/) 拆分，2 直接实施方案，3 输入修改；必须根据方案细节判断推荐拆分还是直接实施，只给被推荐的 1 或 2 追加具体推荐理由，不得默认推荐；方案确认并获得执行授权后，任何风险信号、影响范围变化或执行内异常都不得触发二次确认，必须在既定范围内继续处理；只有需要新增外部授权、超出确认范围或执行不可逆操作时才例外；用户选择 2 时直接开始实施，不再二次询问确认。"
