interface:
  display_name: "需求澄清门"
  short_description: "实质执行前先过统一门禁；覆盖显式实现请求与需求列表式隐含实施请求"
  default_prompt: "使用 $execution-gate 处理新增、增加、补充、调整、修复、排查、生成、实现或继续已有任务，包括直接给出需求列表、业务规则、报表口径、生成条件、参与度口径等隐含要求落地的场景：先输出任务理解、轻/重任务判断与风险；轻任务直接执行；重任务显式转交 $ambiguity-planner 做分步收敛；方案文件写入 docs/plans 后必须先确认是否拆分实施任务，用户确认拆分时调用 $plan-implementation-tasks 生成 docs/tasks/<方案文件>/tasks-N.md 与 implementation-guide.md，规划完毕后询问用户是否按实施指导文件按步骤执行；若任务会产生正式改动且位于 Git 仓库中，再使用 $git-action 处理任务分支与高风险 Git 动作。"
