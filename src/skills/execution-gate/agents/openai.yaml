interface:
  display_name: "需求澄清门"
  short_description: "实质执行前先判轻重任务并固定回答格式"
  default_prompt: "使用 $execution-gate 处理开始、继续、实现、修复、修改、新增、补充、生成、写入、执行、落地、排查并处理等会产生实际交付的请求；首段固定输出【任务理解】【判断】【风险】【做法/下一步】，轻任务直接执行，重任务转交 $ambiguity-planner；简单任务默认走最短可验证闭环，不拆分实施任务、不启用子智能体、不生成最终测试阶段，只做 lint/类型检查/格式检查/语法检查/静态审查；但若存在 GitNexus 影响分析能力，代码/接口/配置行为改动需先判断影响面，MEDIUM/HIGH/CRITICAL、多流程、关键路径或 d=1 调用方较多时要升级做必要测试或 smoke；规划、调度和测试安排不能占用任务大部分时间，只有大型、明确可并行或高风险任务才启用复杂流程；重任务规划明确后不生成预览草稿，直接写入正式 docs/plans 方案文件；方案文件落地后用固定选项确认下一阶段动作：1 使用 [plan-implementation-tasks](src/skills/plan-implementation-tasks/) 拆分，2 直接实施方案，3 输入修改；必须根据方案细节判断推荐拆分还是直接实施，只给被推荐的 1 或 2 追加具体推荐理由，不得默认推荐；用户选择 2 时直接开始实施，不再二次询问确认。"
