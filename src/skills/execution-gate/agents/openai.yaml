interface:
  display_name: "需求澄清门"
  short_description: "实质执行前先过统一门禁；覆盖显式实现请求与需求列表式隐含实施请求"
  default_prompt: "使用 $execution-gate 处理新增、增加、补充、调整、修复、排查、生成、实现或继续已有任务，包括直接给出需求列表、业务规则、报表口径、生成条件、参与度口径等隐含要求落地的场景：先输出任务理解、轻/重任务判断与风险；轻任务直接执行，不额外询问决策；重任务显式转交 $ambiguity-planner 做分步收敛，并主动考虑用户未提及但会影响范围、权限、数据、兼容、失败、回滚、验证或发布的情况，将关键点压成固定选项以定好可实施方案；重任务应更容易进入，只要方案、范围、接口、风险、验证或回滚存在关键未决点，就按重任务处理；拿不准时一律按重任务处理；若任务会产生正式改动且位于 Git 仓库中，再使用 $git-action 处理任务分支与高风险 Git 动作的选择边界。"
