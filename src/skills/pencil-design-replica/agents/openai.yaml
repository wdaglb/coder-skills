interface:
  display_name: "Pencil 设计复现"
  short_description: "按 Pencil 设计稿先做确认 demo，再落地现有或新页面"
  default_prompt: "Use $pencil-design-replica to inspect the current Pencil canvas, .pen file, or design screenshot, build a confirmation demo first, then integrate the approved UI into the current project while preserving existing business logic when needed; for simple static UI or local copy/style changes, only run lint/type/format/static checks and do not run tests, smoke, app startup, or manual regression unless requested or risk requires it; if GitNexus impact analysis is available and shows MEDIUM/HIGH/CRITICAL impact, multiple flows, critical path, or many d=1 callers, add necessary tests, smoke, or runtime validation."
