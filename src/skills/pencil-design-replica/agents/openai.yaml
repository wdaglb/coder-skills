interface:
  display_name: "Pencil 设计复现"
  short_description: "按 Pencil 设计稿先做确认 demo，再落地现有或新页面"
  default_prompt: "Use $pencil-design-replica to inspect the current Pencil canvas, .pen file, or design screenshot, build a confirmation demo first, then integrate the approved UI into the current project while preserving existing business logic when needed; all changes only run the current project's static lint by default, and do not run type checks, formatting, builds, tests, smoke, app startup, screenshots, or manual regression unless the user explicitly requests them; if lint is unavailable, report validation as incomplete rather than substituting another check; GitNexus impact analysis only reports scope and never upgrades testing requirements automatically."
