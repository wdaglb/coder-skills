interface:
  display_name: "规划实施任务"
  short_description: "将已确认方案快速拆成少量高价值任务文件"
  default_prompt: "使用 $plan-implementation-tasks 将已落地并确认的方案文件拆分为实施任务文件；默认采用快速模式，生成少量高价值 tasks-N.md 和轻量 implementation-guide.md，简单方案可以只生成 tasks-1.md，能串行就不并行，能一个任务讲清楚就不拆多个；只有大型、明确可并行或高风险任务才展开并行/严格模式；前后端项目先确认接口契约，再按真实依赖决定前后端编码是否并行，不要机械固定为 5 个任务；编码任务只做静态验证，简单任务不要生成最终测试或 smoke 任务，只安排 lint/类型检查/格式检查/语法检查/静态审查；但若存在 GitNexus 影响分析能力，代码/接口/配置行为改动需先判断影响面，MEDIUM/HIGH/CRITICAL、多流程、关键路径或 d=1 调用方较多时要生成必要测试或 smoke 收口；非简单任务最终测试前必须先执行 $audit-completion-risks，最终自动化/集成/e2e/手工/回归测试放到独立验证任务或收口流程；规划完毕后必须询问用户是否按 implementation-guide.md 执行，默认由当前主智能体串行执行，只有存在明确可并行组时才询问是否启用子智能体；开始实施后 docs/plans 与 docs/tasks 默认只读，除非用户明确要求修改。"
