interface:
  display_name: "规划实施任务"
  short_description: "将已确认方案快速拆成少量高价值任务文件"
  default_prompt: "使用 $plan-implementation-tasks 将已落地并确认的方案文件拆分为实施任务文件；默认采用快速模式，生成少量高价值 tasks-N.md 和轻量 implementation-guide.md，简单方案可以只生成 tasks-1.md，能串行就不并行，能一个任务讲清楚就不拆多个；只有大型、明确可并行或高风险任务才展开并行/严格模式；前后端项目先确认接口契约，再按真实依赖决定前后端编码是否并行，不要机械固定为 5 个任务；所有任务只安排当前项目已有的静态 lint，lint 缺失或不可运行时明确标注验证未完成，不以类型检查、格式检查、构建、测试、smoke 或运行态验证替代；只有用户明确指定测试时，才生成对应的独立验证任务；GitNexus 只用于判断影响范围，不自动升级测试要求；规划完毕后必须询问用户是否按 implementation-guide.md 执行，默认由当前主智能体串行执行，只有存在明确可并行组时才询问是否启用子智能体；开始实施后 docs/plans 与 docs/tasks 默认只读，除非用户明确要求修改。"
