interface:
  display_name: "重任务规划器"
  short_description: "处理重任务的分步澄清、推荐选项与逐步规划"
  default_prompt: "使用 $ambiguity-planner 处理重任务：按步骤逐步收敛当前最关键的问题；若有【已确认边界】，必须先输出【已确认边界】，再输出【当前步骤】，最后把【选择】固定在底部；1 / 2 / 3 / 4 四项中第 1 项必须是推荐方案，并在括号中用一句话说明推荐理由；不要单独输出推荐说明段落，也不要在用户选择前单独输出影响分节；重任务应更容易进入，只要方案、范围、接口、风险、验证或回滚存在关键未决点，就停在确认环节；提问深度不能固定为 1-3 步，但只确认会改变实施路径的关键边界，能稳定实施就及时停问，不把任务拆分、子智能体调度或测试数量设计成新的复杂任务；方案文件准备写入 docs/plans 前，必须先确认已有完整方案正文，缺少正文时不得编造或输出空方案，必须继续收敛或补齐正文；有完整正文后不再单独询问是否落实方案文件，也不生成预览草稿文件，直接写入正式 docs/plans 方案文件；方案写入后退出方案规划且方案文件默认只读，并输出方案文件审查固定选项：1 使用 [plan-implementation-tasks](src/skills/plan-implementation-tasks/) 拆分，2 直接实施方案，3 输入修改；必须根据方案细节判断推荐拆分还是直接实施，只给被推荐的 1 或 2 追加具体推荐理由，不得默认推荐；用户选择 1 时调用 $plan-implementation-tasks，用户选择 2 时直接开始实施，不再询问用户确认，用户选择 3 或输入任何非 1/2 内容时按输入修改处理并更新正式方案文件。"
