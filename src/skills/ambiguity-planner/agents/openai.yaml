interface:
  display_name: "重任务规划器"
  short_description: "处理重任务的分步澄清、推荐方案与逐步规划"
  default_prompt: "使用 $ambiguity-planner 处理重任务：按步骤逐步收敛当前最关键的问题，先给出当前推荐与 1 / 2 / 3 / 4 固定选项，不要在用户选择前单独输出影响分节；重任务应更容易进入，只要方案、范围、接口、风险、验证或回滚存在关键未决点，就停在确认环节；提问深度不能固定为 1-3 步，必须根据实际复杂度、代码上下文和用户选择持续深入；方案文件准备写入 docs/plans 前，必须先确认已有完整方案正文，缺少正文时不得编造或输出空方案，必须继续收敛或补齐正文；有完整正文后输出完整方案内容和目标路径让用户审查，只有用户选择 1 确认写入时才写入，非 1 输入默认视为修改方案并继续审查；方案写入后退出方案规划且方案文件只读，再确认是否拆分实施任务。"
