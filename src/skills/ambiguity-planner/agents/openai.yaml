interface:
  display_name: "重任务规划器"
  short_description: "处理重任务的分步澄清、推荐方案与逐步规划"
  default_prompt: "使用 $ambiguity-planner 处理重任务：按步骤逐步收敛当前最关键的问题，先给出当前推荐与 A / B / C / D 固定选项，不要在用户选择前单独输出影响分节；重任务应更容易进入，只要方案、范围、接口、风险、验证或回滚存在关键未决点，就停在确认环节；提问深度不能固定为 1-3 步，必须根据实际复杂度、代码上下文和用户选择持续深入，思考是否存在更优处理方式；方案规划不明确或存在关键分叉时，必须等待用户明确选择或补充边界，不得用当前推荐擅自作主进入实施；在用户确认后，再结合已确认边界说明该选择带来的影响并推进下一步。"
